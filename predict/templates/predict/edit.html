{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{% static '/css/style.css' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Result</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body" data-bs-theme="dark">
        <div class="container-fluid">
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link" href="{% url 'predict:upload_audio' %}">Predict</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
      <div class="text-center mt-3">
            <h2 class="">Result № {{ id }}</h2>
      </div>

      <div class="container text-center">
        <div class="row align-items-start">
            <div class="col-sm-4 mx-auto">
                <div class="mt-4">
                    <form class="mt-4" method="POST" enctype="multipart/form-data">
                        <div class="">
                            <label for="audio" class="form-label">Audio</label>
                        </div>
                        <div class="mb-3">
                          <!-- <label for="audio" class="form-label">Audio</label> -->
                          <!-- <input type="text" class="form-control" id="name" value="{{audio.file.url}}" disabled> -->
                          <audio src="{{audio.file.url}}" controls></audio>
                        </div>
                        <div class="mb-3">
                          <label for="gender" class="form-label">Result</label>
                          <pre>{{ audio.result }}</pre>
                        </div>
                      </form>
                      <hr>
                      <h3>Please, appreciate the quality of the model's predict and help improve it. Thank you!</h3>
                      <form class="mt-4" method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-3">
                          <label for="name" class="form-label">Was the prediction correct?</label>
                          {{ form.is_right }}
                        </div>
                        <div class="mb-3">
                          <label for="gender" class="form-label">Speaker`s gender</label>
                          {{ form.gender }}
                        </div>
                        <div class="mb-3">
                            <label for="age" class="form-label">Speaker`s age</label>
                            {{ form.age }}
                        </div>
                        <div class="mb-3">
                          <label for="age" class="form-label">Speaker`s dialect</label>
                          {{ form.region }}
                        </div>
                        <button type="submit" class="btn btn-primary mb-3" name="submit">Submit</button>
                      </form>
                      <hr>
                      <a href="{% url 'predict:upload_audio' %}">predict again</a>
                      <br><br><br>
                </div>
            </div>
          </div>
        </div>

    <script src="{% static '/js/copy_link.js' %}"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
