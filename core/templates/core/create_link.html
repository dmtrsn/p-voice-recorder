{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{% static '/css/style.css' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Record</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body" data-bs-theme="dark">
        <div class="container-fluid">
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <!-- <li class="nav-item">
                <a class="nav-link" aria-current="page" href="{% url 'core:index' %}">Main</a>
              </li> -->
              <li class="nav-item">
                <a class="nav-link" href="{% url 'core:record' %}">Record</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="">Create link</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" aria-current="page" href="{% url 'core:list_of_records' 'all' %}">List of records</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>

      <h2 class="text-center mt-3">Create interview invitation</h2>

      <div class="container text-center">
        <div class="row align-items-start">
            <div class="col-sm-4 mx-auto">
                <div class="mt-4">
                    <form class="mt-4" method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-3">
                          <label for="name" class="form-label">Name</label>
                          {{ form.name }}
                        </div>
                        <div class="mb-3">
                          <label for="gender" class="form-label">Gender</label>
                          {{ form.gender }}
                        </div>
                        <div class="mb-3">
                            <label for="age" class="form-label">Age</label>
                            {{ form.age }}
                        </div>
                        <div class="mb-3">
                          <label for="age" class="form-label">Region</label>
                          {{ form.region }}
                        </div>
                        <button type="submit" class="btn btn-primary mb-3" name="submit">Send</button>
                      </form>
                </div>
            </div>
          </div>
        </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.0/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
