upstream django {
    server django:3456;
}

server {
    listen 4567;
    listen [::]:4567;

    server_name dmtrii.online;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        allow all;
	root /var/www/certbot;
    }

   # location / {
   #     return 301 https://$host$request_uri;
   # }
}

